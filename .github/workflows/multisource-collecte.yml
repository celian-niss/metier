name: collecte-multisource

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Collecter et consolider
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_PAGES: "5"
        run: python scripts/collecter.py
      - name: Commit des données
        run: |
          git config user.name "pulse-emploi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/multisource.json data/multisource/
          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "veille multisource: $(date -u +%F)"
            git push
          fi
