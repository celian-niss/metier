name: refresh-resume

on:
  push:
    branches: [main]
    paths:
      - "scripts/resumer.py"
      - ".github/workflows/refresh-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Régénérer le résumé depuis les dernières offres collectées
        run: python scripts/resumer.py
      - name: Vérifier les tests
        run: python -m pytest -q
      - name: Commit du résumé
        run: |
          git config user.name "metier-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/resume.json data/geo/
          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "data: régénère le résumé analytique"
            git push
          fi
